<!doctype html>
<html lang="es">
<head>

<title>Control Financiero</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#10203a}.app{display:flex;min-height:100vh}.side{width:250px;background:#111a2b;color:#fff;padding:18px 10px}.brand{font-size:22px;font-weight:800;line-height:1.35;margin:0 12px 4px}.sub{font-size:12px;color:#b9c2d2;margin:0 12px 22px}.nav{display:flex;flex-direction:column;gap:4px}.nav button{border:0;background:transparent;color:#fff;text-align:left;padding:12px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#202c40}.main{flex:1;padding:28px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.title{font-size:30px;font-weight:800;margin:0 0 8px}.subtitle{color:#334766;margin:0}.year{padding:10px 12px;border:1px solid #d5dbe5;border-radius:7px;background:#fff;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.card{background:#fff;border:1px solid #e0e4eb;border-radius:12px;padding:17px}.label{font-size:13px;color:#40536f;margin-bottom:7px}.value{font-size:25px;font-weight:800}.green{color:#009b70}.red{color:#ef2227}.section{background:#fff;border:1px solid #e0e4eb;border-radius:12px;padding:16px;margin-bottom:18px}.section h2{margin:0 0 18px;font-size:21px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid #e6e9ee;font-size:14px}.table th{text-align:left}.table th:not(:first-child),.table td.num{text-align:right}.clickable{font-weight:700;cursor:pointer;white-space:nowrap}.income{color:#0758d9}.expense{color:#ef2227}.arrow{font-size:11px}.detail-row td{padding:0 8px 10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 0 2px}.detail-card{background:#f8fafc;border:1px solid #dfe5ed;border-radius:10px;padding:13px 16px}.income-detail{border-left:4px solid #0758d9}.expense-detail{border-left:4px solid #ef2227}.detail-title{font-weight:800;font-size:14px;margin-bottom:8px}.income-detail .detail-title,.income-detail b{color:#0758d9}.expense-detail .detail-title,.expense-detail b{color:#ef2227}.detail-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e5eaf0}.detail-item:last-child{border-bottom:0}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{border:1px solid #dce2ea;border-radius:10px;padding:14px;background:#fff}.module strong{display:block;margin-bottom:6px}.module span{font-size:13px;color:#64748b}.status{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:900px){.side{width:190px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{display:block}.side{width:100%}.main{padding:12px}.cards{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.table{min-width:760px}.section{overflow:auto}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">CONTROL<br>FINANCIERO</div><div class="sub">Basado directamente en tu Excel</div><div class="nav"><button class="active">Inicio</button><button>Ingresos y gastos</button><button>Pagos</button><button>Deudas</button><button>Terreno</button><button>Bolsa TRII</button></div></aside>
<main class="main"><div class="top"><div><h1 class="title">Resumen financiero</h1><p class="subtitle">Datos cargados desde 2.-PAGOS(3).xlsx</p></div><select id="year" class="year"></select></div>
<div class="cards"><div class="card"><div class="label" id="incomeLabel"></div><div class="value green" id="incomeTotal"></div></div><div class="card"><div class="label" id="expenseLabel"></div><div class="value red" id="expenseTotal"></div></div><div class="card"><div class="label">Balance</div><div class="value" id="balanceTotal"></div></div><div class="card"><div class="label">Saldo anterior</div><div class="value green" id="previousTotal"></div></div></div>
<section class="section"><h2 id="movTitle"></h2><table class="table"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Saldo</th></tr></thead><tbody id="rows"></tbody></table></section>
<section class="section"><h2>Módulos</h2><div class="modules"><div class="module"><strong>Ingresos y gastos</strong><span>Histórico por categorías</span></div><div class="module"><strong>Pagos</strong><span>Registrar pagos</span></div><div class="module"><strong>Deudas</strong><span>Control de deudas</span></div><div class="module"><strong>Terreno</strong><span>Seguimiento</span></div><div class="module"><strong>Bolsa TRII</strong><span>Inversiones</span></div></div></section><div class="status" id="status"></div></main></div>

const details={
2017:{income:[ [0,0,0,.09],[0,0,1900,1000],[0,1106.08,1500,.01],[0,0,2500,0],[0,0,1800,700],[0,3232.90,600,.01],[600,500,0,0],[2000.86,1700,0,.13],[1769,2900,0,3293.32],[1884.94,0,0,.28],[1884.94,0,490,2000.12],[1884.94,2301.11,0,1400.09]],expense:[ [139.9,31.56,83.25,95.2,104.9,400,0,0,1091.3,0,0,0,683.77],[169.5,0,90.65,0,104.9,270,0,0,1095.06,0,0,0,170.14],[160.5,32.56,83.85,95,104.9,250,0,0,1087.3,0,0,0,170.27],[177.9,53.16,87.55,94.85,104.9,300,1015,0,1086.52,0,0,0,223.77],[138.6,32.67,89.3,95.05,105.9,503.5,0,0,1120.68,0,0,0,350.3],[120.1,34.87,92.35,94.85,105.9,0,1055,0,1113,0,0,0,380.26],[109.4,32.58,89.55,0,72.3,702,1235,0,1108.1,0,0,0,70.38],[109.5,38.75,0,96.35,79,550,1220,0,1105.32,0,0,0,113.49],[105.1,31.65,0,97.05,79,712,1220,454.41,1119.7,0,0,0,1153.3],[120,48.1,0,98.5,79,949.09,1120,0,1122.35,454.41,0,0,160],[122.7,36.31,0,101.1,79,1266,0,0,1106.62,433.3,0,0,200.22],[133.9,45.73,42.61,96.9,79,0,244,0,1148.54,460,0,0,2674.84]]},

function render(){const y=Number(document.getElementById('year').value),d=data[y];const inc=d.income.reduce((a,b)=>a+b,0),exp=d.expense.reduce((a,b)=>a+b,0),balance=inc-exp;document.getElementById('incomeLabel').textContent='Ingresos '+y;document.getElementById('expenseLabel').textContent='Gastos '+y;document.getElementById('incomeTotal').textContent=money(inc);document.getElementById('expenseTotal').textContent=money(exp);document.getElementById('balanceTotal').textContent=money(balance);document.getElementById('balanceTotal').className='value '+(balance>=0?'green':'red');document.getElementById('previousTotal').textContent=money(d.previous);document.getElementById('movTitle').textContent='Movimientos '+y;const body=document.getElementById('rows');body.innerHTML='';const det=details[y];M.forEach((m,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${m}</td><td class="num clickable income" data-type="income" data-i="${i}">${money(d.income[i])} <span class="arrow">▼</span></td><td class="num clickable expense" data-type="expense" data-i="${i}">${money(d.expense[i])} <span class="arrow">▼</span></td><td class="num ${d.income[i]-d.expense[i]>=0?'green':'red'}">${money(d.income[i]-d.expense[i])}</td>`;body.appendChild(tr);if(det){const dr=document.createElement('tr');dr.className='detail-row';dr.id=`detail-${i}`;dr.style.display='none';const ic=det.income?D(d.incomeNames,det.income[i]):[];const ex=det.expense?D(d.expenseNames,det.expense[i]):[];dr.innerHTML=`<td colspan="4"><div class="detail-grid"><div class="detail-card income-detail"><div class="detail-title">Detalle de ingresos</div>${ic.map(x=>`<div class="detail-item"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}</div><div class="detail-card expense-detail"><div class="detail-title">Detalle de gastos</div>${ex.map(x=>`<div class="detail-item"><span>${x[0]}</span><b>${money(x[1])}</b></div>`).join('')}</div></div></td>`;body.appendChild(dr)}});document.getElementById('status').textContent=`Año ${y} cargado correctamente.`}
Object.keys(data).forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;document.getElementById('year').appendChild(o)});document.getElementById('year').value='2017';document.getElementById('year').addEventListener('change',render);document.getElementById('rows').addEventListener('click',e=>{const c=e.target.closest('.clickable');if(!c)return;const row=document.getElementById('detail-'+c.dataset.i);if(!row)return;row.style.display=row.style.display==='none'?'table-row':'none'});render();
</script></body></html>
