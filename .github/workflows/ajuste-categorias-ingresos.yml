name: Ajuste categorias ingresos

on:
  push:
    branches: [principal]

permissions:
  contents: write

jobs:
  ajuste:
    if: ${{ !contains(github.event.head_commit.message, 'Ajustar categorias de ingresos') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar categorias
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const defaultIncomeCats=['Sueldo','Gratificación','CTS','Liquidación','Otros'];", "const defaultIncomeCats=['Sueldo','Gratificación','Utilidades','CTS','Liquidación','Otros'];")
          s = s.replace('Ingresos: Sueldo, Gratificación, CTS, Liquidación, Otros.', 'Ingresos: Sueldo, Gratificación, Utilidades, CTS, Liquidación, Otros.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Ajustar categorias de ingresos"
          git push
