name: Integrar movimientos Supabase
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-movements.yml'
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[auto-movements]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar script de movimientos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="movements-sync.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/inject-movements.yml
          git rm .github/workflows/inject-movements.yml
          git commit -m 'Integrar movimientos con Supabase [auto-movements]' || exit 0
          git push
