name: Fix Terreno navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Redirect Terreno to the new module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace(
              '<button data-page="land">⌖ &nbsp; Terreno</button>',
              '<button onclick="window.location.href=\'terreno.html\'">⌖ &nbsp; Terreno</button>'
          )
          s2 = s2.replace(
              '<button onclick="showPage(\'land\')">⌖ &nbsp; Terreno</button>',
              '<button onclick="window.location.href=\'terreno.html\'">⌖ &nbsp; Terreno</button>'
          )
          if s2 == s:
              print('No navigation change was necessary.')
          else:
              p.write_text(s2, encoding='utf-8')
              print('Terreno navigation updated.')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-terreno-navigation.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Corregir navegación al módulo Terreno"
          git push
