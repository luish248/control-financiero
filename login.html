<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · LHG SYSTEM</title>
<style>
:root{--blue:#1264e8;--blue2:#0a2b55;--bg:#f4f7fb;--line:#dce4ee;--text:#10213a;--muted:#64748b;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#06182e 0%,#0b315c 45%,#f4f7fb 45%,#f4f7fb 100%);color:var(--text);display:grid;place-items:center;padding:24px}
.login-shell{width:min(940px,100%);display:grid;grid-template-columns:1fr 430px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 70px #06182e35;border:1px solid #ffffff80}
.brand-side{background:linear-gradient(160deg,#06182e,#0a2f5c);color:#fff;padding:54px 42px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.brand-side img{width:min(330px,90%);max-height:220px;object-fit:contain;margin-bottom:26px;filter:drop-shadow(0 12px 22px #0004)}
.brand-side h1{margin:0;font-size:28px}.brand-side p{margin:9px 0 0;color:#b9c8dc;font-size:13px}
.form-side{padding:48px 42px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.08em;text-transform:uppercase}.title{font-size:28px;margin:7px 0 6px}.subtitle{margin:0 0 28px;color:var(--muted);font-size:13px}
.field{display:grid;gap:7px;margin-bottom:17px}.field label{font-size:11px;font-weight:800;color:#52627a}.field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:#fff;color:var(--text);outline:none}.field input:focus{border-color:#8db6f5;box-shadow:0 0 0 4px #1264e814}
.primary{width:100%;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 16px;font-weight:800;cursor:pointer}.primary:hover{background:#0f5bd4}.primary:disabled{opacity:.65;cursor:wait}.message{min-height:20px;margin:13px 0 0;font-size:12px;color:var(--red)}.footer{margin-top:28px;padding-top:17px;border-top:1px solid #edf0f4;text-align:center;color:var(--muted);font-size:11px}.security{margin-top:12px;font-size:10px;color:#8a98aa;text-align:center}
@media(max-width:760px){body{background:var(--bg);padding:14px}.login-shell{grid-template-columns:1fr}.brand-side{padding:30px 22px}.brand-side img{width:250px;height:130px;margin-bottom:12px}.brand-side h1{font-size:22px}.form-side{padding:34px 26px}}
</style>
</head>
<body>
<main class="login-shell">
<section class="brand-side">
<img src="/lhg-logo.svg" alt="LHG SYSTEM">
<h1>LHG SYSTEM</h1>
<p>Innovación · Control · Resultados</p>
</section>
<section class="form-side">
<div class="eyebrow">CONTROL FINANCIERO</div>
<h2 class="title">Iniciar sesión</h2>
<p class="subtitle">Ingresa con tu correo y contraseña para continuar.</p>
<form id="loginForm">
<div class="field"><label for="email">CORREO ELECTRÓNICO</label><input id="email" type="email" autocomplete="username" placeholder="correo@ejemplo.com" required></div>
<div class="field"><label for="password">CONTRASEÑA</label><input id="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required></div>
<button id="loginButton" class="primary" type="submit">Iniciar sesión</button>
<div id="message" class="message" role="alert"></div>
</form>
<div class="footer">Acceso protegido mediante Supabase Auth.</div>
<div class="security">Tus credenciales no se guardan en este navegador.</div>
</section>
</main>
<script>
const form=document.getElementById('loginForm');
const button=document.getElementById('loginButton');
const message=document.getElementById('message');
form.addEventListener('submit',async(e)=>{
 e.preventDefault();message.textContent='';button.disabled=true;button.textContent='Ingresando...';
 try{
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||'No se pudo iniciar sesión.');
  window.location.replace('/');
 }catch(err){message.textContent=err.message||'No se pudo iniciar sesión.';button.disabled=false;button.textContent='Iniciar sesión';}
});
</script>
</body>
</html>
